name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --console --name Voorhees
          --collect-data discord
          --collect-submodules yt_dlp
          --collect-all google.genai
          --collect-data gtts
          --collect-data tzdata
          Voorhees.py
      - name: Smoke test (no .env -> exits with token error)
        shell: bash
        run: |
          cd dist
          out=$(echo | ./Voorhees.exe 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "DISCORD_BOT_TOKEN"
      - uses: actions/upload-artifact@v4
        with:
          name: Voorhees-exe
          path: dist/Voorhees.exe
